<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Eufy Smart Scale BLE — your weigh-in, at home in Home Assistant</title>
  <desc id="desc">A conceptual scale with a Bluetooth symbol connects directly to a home. Local measurements, no Eufy account. Navy and mint follow the integration's existing icon. The illustration is not a product photograph or a live measurement.</desc>

  <rect width="1200" height="500" rx="24" fill="#102B40"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="56" y="62" fill="#7CF3E8" font-size="22" font-weight="600" letter-spacing="2">EUFY SMART SCALE BLE</text>
    <text x="52" y="160" fill="#F0F9F8" font-size="76" font-weight="700" letter-spacing="-3">Your weigh-in.</text>
    <text x="52" y="245" fill="#F0F9F8" font-size="76" font-weight="700" letter-spacing="-3">At home in</text>
    <text x="52" y="330" fill="#7CF3E8" font-size="76" font-weight="700" letter-spacing="-3">Home Assistant.</text>
    <text x="56" y="420" fill="#F0F9F8" font-size="29">Local Bluetooth. No Eufy account.</text>
  </g>

  <!-- Scale and Bluetooth motif derived from the integration's brand icon. -->
  <g id="scale" transform="translate(800 64)">
    <rect x="0" y="0" width="304" height="304" rx="64" fill="#102B40" stroke="#26CBBB" stroke-width="4"/>
    <rect x="18" y="18" width="268" height="268" rx="49" fill="none" stroke="#ABC3CE" stroke-opacity="0.2" stroke-width="2"/>
    <rect x="78" y="38" width="148" height="52" rx="18" fill="#F0F9F8"/>
    <rect x="88" y="48" width="128" height="32" rx="10" fill="#102B40"/>
    <path d="M119 64h19m28 0h19" fill="none" stroke="#7CF3E8" stroke-width="6" stroke-linecap="round"/>
    <path d="M117 156l78 55-43 36V122l43 35-78 55" fill="none" stroke="#7CF3E8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="local-connection" fill="none" stroke="#7CF3E8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M952 370v39h61"/>
    <path d="M1005 401l8 8-8 8"/>
    <path d="M1040 405l27-24 27 24m-47-6v36h40v-36m-27 36v-19h14v19"/>
  </g>
</svg>
