# Temporary formatting workflow; removed after this run.
name: Format body composition implementation

on:
  push:
    branches:
      - feat/body-composition
    paths:
      - ".github/workflows/materialize-body-composition.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/materialize-body-composition.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/body-composition
          fetch-depth: 0

      - name: Install Ruff
        run: python -m pip install ruff==0.16.4

      - name: Format source and tests
        run: ruff format custom_components tests

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components tests
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "style: format body composition implementation"
          git push origin HEAD:feat/body-composition
