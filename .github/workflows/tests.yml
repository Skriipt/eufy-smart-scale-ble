name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Validate JSON metadata
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/eufy_p3_ble/manifest.json >/dev/null
          python -m json.tool custom_components/eufy_p3_ble/strings.json >/dev/null
          python -m json.tool custom_components/eufy_p3_ble/translations/en.json >/dev/null
          python -m json.tool custom_components/eufy_p3_ble/translations/de.json >/dev/null

      - name: Validate release metadata
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          manifest_version = json.loads(
              Path("custom_components/eufy_p3_ble/manifest.json").read_text()
          )["version"]
          project_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if manifest_version != project_version:
              raise SystemExit(
                  f"Version mismatch: manifest={manifest_version}, project={project_version}"
              )
          changelog = Path("CHANGELOG.md").read_text()
          if f"## [{manifest_version}]" not in changelog:
              raise SystemExit(f"CHANGELOG.md has no section for {manifest_version}")
          PY

      - name: Compile Python sources
        run: python -m compileall -q custom_components tests

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check pure calculation and protocol layers
        run: mypy

      - name: Run tests with branch coverage
        run: |
          pytest --cov=custom_components/eufy_p3_ble --cov-branch --cov-report=term-missing
          coverage report \
            --include='*/body_composition.py,*/composition_manager.py,*/parser.py,*/bluetooth.py,*/device.py' \
            --fail-under=95
