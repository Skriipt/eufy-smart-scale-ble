name: Task 1 formatter

on:
  push:
    branches:
      - test/lock-p3-behavior

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-task1-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Task 1 branch
        uses: actions/checkout@v4
        with:
          ref: test/lock-p3-behavior

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.4

      - name: Apply Ruff formatting only
        run: |
          ruff format docs/superpowers/plans/2026-08-24-eufy-multi-scale-support.md tests/test_device.py

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "Nothing to format."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-08-24-eufy-multi-scale-support.md tests/test_device.py
          git commit -m "style: format Task 1 regression files [skip-task1-format]"
          git push origin HEAD:test/lock-p3-behavior
