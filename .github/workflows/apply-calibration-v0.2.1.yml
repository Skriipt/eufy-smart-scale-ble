name: Apply calibration v0.2.1

on:
  push:
    branches:
      - fix/eufy-calibration-v0.2.1
    paths:
      - .github/workflows/apply-calibration-v0.2.1.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out calibration branch
        uses: actions/checkout@v4
        with:
          ref: fix/eufy-calibration-v0.2.1
          fetch-depth: 0

      - name: Apply calibrated fixed-point rules
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("custom_components/eufy_p3_ble/body_composition.py")
          text = path.read_text()
          replacements = [
              (
                  'ALGORITHM_ID: Final = "eufy_p3_compatible_v1"',
                  'ALGORITHM_ID: Final = "eufy_p3_compatible_v2"',
              ),
              (
                  'weight_deci_kg = _round_half_up_positive(measurement.weight_kg * 10)',
                  'weight_deci_kg = _trunc(measurement.weight_kg * 10)',
              ),
              (
                  'water_base_permille = (1000 - fat_rate_permille) * 7 / 10',
                  'water_base_permille = _trunc((1000 - fat_rate_permille) * 7 / 10)',
              ),
              (
                  'protein_deci_kg = _round_half_up_positive(water_deci_kg * 0.275)',
                  'protein_deci_kg = _round_half_up_positive(water_deci_kg * 0.3133)',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one occurrence of {old!r}, found {count}")
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Commit calibration patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/eufy_p3_ble/body_composition.py
          git commit -m "fix: calibrate Eufy fixed-point calculations"
          git push origin HEAD:fix/eufy-calibration-v0.2.1
