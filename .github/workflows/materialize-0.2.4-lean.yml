name: Materialize 0.2.4 lean parity fix

on:
  push:
    branches: [release/0.2.4-eufy-parity]
    paths:
      - .github/workflows/materialize-0.2.4-lean.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.2.4-eufy-parity
          fetch-depth: 0

      - name: Apply lean body mass display parity change
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("custom_components/eufy_p3_ble/body_composition.py")
          text = path.read_text()

          old = "    lean_body_mass_deci_kg = weight_deci_kg - body_fat_deci_kg\n"
          new = old + "    lean_body_mass_display_deci_kg = _round_half_up_positive(\n        measurement.weight_kg * 10 - body_fat_deci_kg\n    )\n"
          if text.count(old) != 1:
              raise SystemExit("Expected lean body mass assignment exactly once")
          text = text.replace(old, new)

          old_return = "        lean_body_mass_kg=lean_body_mass_deci_kg / 10,"
          new_return = "        lean_body_mass_kg=lean_body_mass_display_deci_kg / 10,"
          if text.count(old_return) != 1:
              raise SystemExit("Expected lean body mass return exactly once")
          text = text.replace(old_return, new_return)
          path.write_text(text)

          tests = Path("tests/test_body_composition.py")
          test_text = tests.read_text()
          old_test = "    assert result.lean_body_mass_kg == 60.6\n"
          new_test = "    assert result.lean_body_mass_kg == 60.7\n"
          if test_text.count(old_test) != 1:
              raise SystemExit("Expected synthetic lean body mass assertion exactly once")
          tests.write_text(test_text.replace(old_test, new_test))
          PY

      - name: Commit materialized change and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-0.2.4-lean.yml
          git add custom_components/eufy_p3_ble/body_composition.py tests/test_body_composition.py
          git commit -m "fix: align lean body mass display with EufyLife"
          git push origin HEAD:release/0.2.4-eufy-parity
