name: Export source workspace

on:
  push:
    branches:
      - feat/multi-scale-support
    paths:
      - .github/workflows/export-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        run: |
          git archive --format=zip --output=eufy-smart-scale-ble.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: eufy-smart-scale-ble-source
          path: eufy-smart-scale-ble.zip
          if-no-files-found: error
