name: Fix calibration tests

on:
  push:
    branches:
      - fix/eufy-calibration-v0.2.1
    paths:
      - .github/workflows/fix-calibration-tests.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/eufy-calibration-v0.2.1
          fetch-depth: 0

      - name: Update reference tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_body_composition.py")
          text = path.read_text()

          text = text.replace(
              "    assert result.protein_percent == 14.5\n",
              "    assert result.protein_percent == 16.6\n",
              1,
          )

          old = """    assert result.body_water_percent == 49.6
    assert result.visceral_fat_level == 11
    assert result.skeletal_muscle_mass_kg == 32.4
"""
          new = """    assert result.body_water_percent == 49.5
    assert result.bmr_kcal_per_day == 1771
    assert result.visceral_fat_level == 11
    assert result.protein_percent == 15.2
    assert result.skeletal_muscle_mass_kg == 32.3
"""
          if old not in text:
              raise SystemExit("Could not find first Eufy reference expectations")
          text = text.replace(old, new, 1)

          marker = "def test_second_observed_eufy_measurement_matches_app() -> None:"
          if marker not in text:
              test = """

def test_second_observed_eufy_measurement_matches_app() -> None:
    result = calculate_body_composition(
        BodyCompositionProfile(sex=Sex.MALE, height_cm=175, age=28),
        BodyMeasurement(
            weight_kg=85.45,
            impedance_ohm=454.5,
            measured_at=MEASURED_AT,
        ),
    )

    assert result.bmi == 27.8
    assert result.body_fat_percent == 27.5
    assert result.body_fat_mass_kg == 23.4
    assert result.lean_body_mass_kg == 62.0
    assert result.muscle_mass_kg == 58.9
    assert result.bone_mass_kg == 3.1
    assert result.body_water_percent == 49.6
    assert result.bmr_kcal_per_day == 1773
    assert result.visceral_fat_level == 11
    assert result.protein_percent == 15.3
    assert result.skeletal_muscle_mass_kg == 32.4
    assert result.subcutaneous_fat_percent == 24.3
    assert result.body_age_years == 30
    assert result.body_type is BodyType.OBESE
"""
              anchor = "\n\n@pytest.mark.parametrize(\n    \"profile\","
              if anchor not in text:
                  raise SystemExit("Could not find insertion point for second reference test")
              text = text.replace(anchor, test + anchor, 1)

          path.write_text(text)
          PY

      - name: Format changed Python files
        run: |
          python -m pip install ruff==0.16.4
          ruff format custom_components/eufy_p3_ble/body_composition.py tests/test_body_composition.py

      - name: Commit fixes and remove temporary workflow
        run: |
          rm .github/workflows/fix-calibration-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: add calibrated Eufy reference vectors"
          git push origin HEAD:fix/eufy-calibration-v0.2.1
