[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "eufy-smart-scale-ble"
version = "0.3.2"
description = "Home Assistant custom integration for Eufy Smart Scales over local BLE"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
authors = [{ name = "Skriipt" }]
dependencies = []

[project.optional-dependencies]
test = [
  "aiousbwatcher==1.1.2",
  "mypy>=1.17,<2",
  "pytest-cov>=7,<8",
  "pytest-homeassistant-custom-component==0.13.357",
  "ruff>=0.12,<1",
  "serialx==1.8.2",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components/eufy_smart_scale_ble"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
files = [
  "custom_components/eufy_smart_scale_ble/body_composition.py",
  "custom_components/eufy_smart_scale_ble/composition_manager.py",
  "custom_components/eufy_smart_scale_ble/model_registry.py",
  "custom_components/eufy_smart_scale_ble/models.py",
  "custom_components/eufy_smart_scale_ble/bluetooth.py",
  "custom_components/eufy_smart_scale_ble/device.py",
  "custom_components/eufy_smart_scale_ble/storage.py",
  "custom_components/eufy_smart_scale_ble/protocol_capture.py",
  "custom_components/eufy_smart_scale_ble/protocols/base.py",
  "custom_components/eufy_smart_scale_ble/protocols/p3.py",
  "custom_components/eufy_smart_scale_ble/protocols/c20.py",
  "custom_components/eufy_smart_scale_ble/protocols/onebyone.py",
  "custom_components/eufy_smart_scale_ble/protocols/legacy_t9140.py",
  "custom_components/eufy_smart_scale_ble/protocols/p2.py",
]
